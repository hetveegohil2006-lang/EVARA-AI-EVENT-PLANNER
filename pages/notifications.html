<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Notifications &amp; Activity Feed — EVARA</title>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/layout.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/responsive.css"/>
  <link rel="stylesheet" href="../css/pages/dashboard.css"/>
  <link rel="stylesheet" href="../css/pages/other-pages.css"/>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/evara-monogram.svg"/>
</head>
<body class="bg-[#F8F4EF]">
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="brand-lockup">
          <div class="brand-monogram">
            <svg viewBox="0 0 60 60" width="22" height="22" fill="none"><path d="M18 17 H42 C44 17 45 18 45 20 C45 22 44 23 42 23 H24 V28 H38 C40 28 41 29 41 30.5 C41 32 40 33 38 33 H24 V37 H43 C45 37 46 38 46 40 C46 42 45 43 43 43 H18 C16.5 43 15.5 42 15.5 40.5 V19.5 C15.5 18 16.5 17 18 17 Z" fill="#E9D8C8"/></svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">EVARA</span>
            <span class="brand-tagline">Private Concierge</span>
          </div>
        </a>
      </div>
      <div class="sidebar-nav">
        <span class="nav-section-title">Navigation</span>
        <a href="../dashboard.html" class="nav-item"><span class="material-symbols-outlined">grid_view</span><span>Dashboard</span></a>
        <a href="notifications.html" class="nav-item active"><span class="material-symbols-outlined">notifications</span><span>Notifications</span></a>
        <a href="profile-settings.html" class="nav-item"><span class="material-symbols-outlined">settings</span><span>Profile &amp; Settings</span></a>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-header">
        <h2 class="font-bold text-base" style="margin: 0;">Concierge Dispatches &amp; Notifications</h2>
        <a href="../dashboard.html" class="btn btn-secondary btn-sm">Return to Dashboard</a>
      </header>

      <main class="content-wrapper">
        <div class="flex items-center justify-between mb-lg">
          <div>
            <h1 class="font-headline-lg" style="margin: 0 0 4px;">Notifications &amp; Activity Feed</h1>
            <p class="font-body-md text-muted" style="margin: 0;">Live system updates, patron registrations, escrow approvals, and concierge alerts.</p>
          </div>
          <div class="flex items-center gap-xs">
            <span class="badge badge-gold" id="unreadNotifBadge">Live Sync</span>
            <button class="btn btn-subtle btn-sm" onclick="NotificationsController.markAllRead()">Mark All as Read</button>
          </div>
        </div>

        <div class="flex items-center gap-xs mb-md flex-wrap">
          <button class="btn btn-sm btn-primary" onclick="filterNotifs('all', this)">All Feeds</button>
          <button class="btn btn-sm btn-secondary" onclick="filterNotifs('rsvp', this)">RSVPs</button>
          <button class="btn btn-sm btn-secondary" onclick="filterNotifs('payments', this)">Escrow &amp; Payments</button>
          <button class="btn btn-sm btn-secondary" onclick="filterNotifs('contracts', this)">Contracts &amp; Logistics</button>
        </div>

        <div id="notificationsList" class="flex flex-col gap-sm">
          <!-- Dynamic Notification Cards Rendered by NotificationsController -->
        </div>
      </main>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../js/firebaseConfig.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/notifications.js"></script>
  <script>
    function filterNotifs(cat, btn) {
      document.querySelectorAll('.flex.items-center.gap-xs.mb-md button').forEach(b => {
        b.className = 'btn btn-sm btn-secondary';
      });
      if (btn) btn.className = 'btn btn-sm btn-primary';
      NotificationsController.renderFeed(cat);
    }
  </script>
</body>
</html>
